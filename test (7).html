<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Interactive Elements Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .section {
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .button-group {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .button-group button {
            background: red;
            color: white;
            border: none;
            padding: 5px 10px;
            margin-left: 10px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <h1>Interactive Elements Example</h1>

    <!-- Section 1 -->
    <div class="section" id="section-1">
        <h2>Section 1</h2>
        <p>Some interactive elements:</p>
        <input type="text" placeholder="Text Input"><br><br>
        <textarea placeholder="Text Area"></textarea><br><br>
        <input type="checkbox" id="check1"> <label for="check1">Checkbox</label><br><br>
        <input type="radio" name="radio-group" id="radio1"> <label for="radio1">Radio Button 1</label><br>
        <input type="radio" name="radio-group" id="radio2"> <label for="radio2">Radio Button 2</label><br><br>
        <select>
            <option value="1">Option 1</option>
            <option value="2">Option 2</option>
        </select><br><br>
        <div class="button-group">
            <button class="remove-section" onclick="removeSection('section-1')">Remove Section</button>
        </div>
    </div>

    <!-- Section 2 -->
    <div class="section" id="section-2">
        <h2>Section 2</h2>
        <p>Another set of interactive elements:</p>
        <button>Button</button><br><br>
        <label for="range">Range Slider:</label>
        <input type="range" id="range" min="1" max="100"><br><br>
        <div class="button-group">
            <button class="remove-section" onclick="removeSection('section-2')">Remove Section</button>
        </div>
    </div>

    <!-- Section 3 -->
    <div class="section" id="section-3">
        <h2>Fix Configuration</h2>
        <div class="mt-3 d-flex" style="justify-content: space-between;gap: 10px;">
            <div class="card p-3 w-50">
                <div class="" style="display:flex;justify-content: space-between;">
                    <label>
                        First name
                        <input type="text" id="config-textbox" tabindex="-1">
                    </label>
                    <label><input type="checkbox" id="fix-tabindex"> Fix tabindex </label>
                </div>
            </div>
            <div class="w-50 card p-3">
                <div class="" style="display:flex;justify-content: space-between;">
                    <a href="#" id="config-link-focus" style="
                    outline: 0;
                    box-shadow: none !important;
                ">I have no focus indication</a>
                    <label><input type="checkbox" id="fix-focusIndicator"> Fix focus indicator </label>
                </div>
            </div>
        </div>
    </div>

    <script>
        function removeSection(sectionId) {
            const section = document.getElementById(sectionId);
            if (section) {
                section.remove();
            }
        }

        // Add change event listener to the checkbox
        document.getElementById('fix-tabindex').addEventListener('change', function (event) {
            const textBox = document.getElementById('config-textbox');

            if (event.target.checked) {
                // Remove tabindex="-1" when the checkbox is checked
                textBox.removeAttribute('tabindex');
            } else {
                // Apply tabindex="-1" when the checkbox is unchecked
                textBox.setAttribute('tabindex', '-1');
            }
        });

        document.getElementById('fix-focusIndicator').addEventListener('change', function (event) {
            const link = document.getElementById('config-link-focus');

            if (event.target.checked) {
                // Remove tabindex="-1" when the checkbox is checked
                link.removeAttribute('style');
            } else {
                // Apply tabindex="-1" when the checkbox is unchecked
                link.setAttribute('style', 'outline: 0;box-shadow: none !important;');
            }
        });
    </script>
</body>

</html>
